name: Build IPA
run-name: Source build · ${{ inputs.source_ref || 'lang-voice' }}
# 本地改动：把出包搬到公开仓库（公开仓库的 Actions 额度免费），不再依赖付费/额度受限的私有构建仓。
# Local change: build from the public fork -- Actions minutes are free for public repositories.
on:
  workflow_dispatch:
    inputs:
      prepared_input:
        description: iOS prepared package JSON ({url, sha256})
        type: string
        required: true
      source_repository:
        description: Source repository
        type: string
        default: TIMYW2K/d2r-mobile
      source_ref:
        description: Branch, tag or commit
        type: string
        default: lang-voice
permissions:
  contents: write
  actions: write
jobs:
  build:
    uses: jiayx/d2r-mobile-build/.github/workflows/pack.yml@main
    with:
      prepared_input: ${{ inputs.prepared_input }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
