# Codemagic build: unsigned sideload IPA on Codemagic's free macOS machines.
#
# 用法 / How to use
#   1. codemagic.io 用 GitHub 登录 → Add application → 选 TIMYW2K/d2r-mobile, 分支 lang-voice
#   2. 构建配置选 "codemagic.yaml"（本文件在仓库根；Codemagic 会自动识别）
#   3. 直接 Start new build；不需要任何 Apple 证书（产物是 ad-hoc 未签名 IPA，用 Sideloadly 安装）
#   4. 构建结束在 Artifacts 里下载 D2RMobile-*.ipa
#
# 与 GitHub Actions 流程相同：下载预处理包 → 校验 → 重新生成界面资源 → xcodebuild → 打包 IPA。
# 预处理包按当前提交自动挑（先找 prepared-manual-<HEAD12>，找不到就用最新的那份，构建内会校验生成输入）。

workflows:
  d2r-ios:
    name: D2R Mobile IPA (unsigned)
    max_build_duration: 120
    environment:
      vars:
        TOOLS_REPOSITORY: jiayx/d2r-mobile-build
        SOURCE_REPOSITORY: TIMYW2K/d2r-mobile
        SOURCE_REF: lang-voice
        MINIMUM_IOS: "26.0"
    scripts:
      - name: Check machine (needs macOS 26 + Xcode 26)
        script: |
          sw_vers
          xcodebuild -version
      - name: Clone tools and source
        script: |
          set -euo pipefail
          git clone "https://github.com/$TOOLS_REPOSITORY.git" tools
          git -C tools checkout main
          git clone --branch "$SOURCE_REF" "https://github.com/$SOURCE_REPOSITORY.git" tools/upstream
          git -C tools/upstream log --oneline -1
      - name: Python environment
        script: |
          set -euo pipefail
          cd tools
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt pillow==12.1.1 numpy==2.4.4 PyYAML==6.0.2
      - name: Record source identity
        script: |
          set -euo pipefail
          cd tools
          export GITHUB_OUTPUT="$(pwd)/.gh-output"; : > "$GITHUB_OUTPUT"
          .venv/bin/python scripts/source/configure.py
      - name: Resolve prepared package
        script: |
          set -euo pipefail
          cd tools
          SHORT=$(git -C upstream rev-parse --short=12 HEAD)
          INFO=$(python3 ../codemagic_pick_pack.py "$SOURCE_REPOSITORY" "$SHORT")
          TAG=$(printf '%s\n' "$INFO" | sed -n 1p)
          URL=$(printf '%s\n' "$INFO" | sed -n 2p)
          SHA=$(printf '%s\n' "$INFO" | sed -n 3p)
          if [ -z "$SHA" ]; then echo "no prepared package available"; exit 1; fi
          echo "prepared package: $TAG"
          printf 'PREPARED_INPUT={"url":"%s","sha256":"%s"}\n' "$URL" "$SHA" > .prepared-env
          cat .prepared-env
      - name: Download and verify the prepared package
        script: |
          set -euo pipefail
          cd tools
          set -a; . ./.prepared-env; set +a
          export GITHUB_OUTPUT="$(pwd)/.gh-output"
          .venv/bin/python scripts/source/prepared.py resolve
          INPUT_REVISION=$(sed -n 's/^input_revision=//p' "$GITHUB_OUTPUT" | tail -1)
          export INPUT_REVISION
          echo "input revision: $INPUT_REVISION"
          .venv/bin/python scripts/source/prepared.py download
      - name: Prepare inputs (verify compatibility + regenerate interface)
        script: |
          set -euo pipefail
          cd tools
          set -a; . ./.prepared-env; set +a
          export GITHUB_OUTPUT="$(pwd)/.gh-output"
          INPUT_REVISION=$(sed -n 's/^input_revision=//p' "$GITHUB_OUTPUT" | tail -1)
          export INPUT_REVISION
          export TOOLS_COMMIT=$(git rev-parse HEAD)
          .venv/bin/python scripts/source/prepared.py prepare
      - name: Build the IPA
        script: |
          set -euo pipefail
          cd tools
          python3 scripts/source/select_xcode.py
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          tar -xzf outputs/native-inputs.tar.gz
          .venv/bin/python scripts/source/build.py "$MINIMUM_IOS" 2>&1 | tee outputs/native-build.log
    artifacts:
      - tools/outputs/D2RMobile-*.ipa
      - tools/outputs/*-report.json
      - tools/outputs/native-build.log
